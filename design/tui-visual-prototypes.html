<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>haji · TUI 视觉方向</title>
<style>
:root{color-scheme:dark;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#111214;color:#e6e7eb}
*{box-sizing:border-box}button{font:inherit}body{margin:0}.gallery{max-width:1500px;margin:auto;padding:36px 40px 48px}.eyebrow{color:#9298a5;font:11px ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:12px 0 28px}h1{font-size:27px;font-weight:550;letter-spacing:-1px;margin:0 0 8px}.intro p{color:#999eaa;font-size:13px;margin:0;line-height:1.7}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls button{cursor:pointer;border:1px solid #30323a;border-radius:6px;padding:8px 13px;background:#18191e;color:#a8acb6;font-size:12px;transition:.15s}.controls button:hover{color:#eee;border-color:#616574}.controls button.active{border-color:#8c7caf;background:#282331;color:#d6c6f1}.controls .divider{width:1px;background:#30323a;margin:3px 5px}.scheme-intro{display:flex;align-items:baseline;gap:16px;margin:0 0 14px}.scheme-intro h2{font-size:18px;font-weight:500;margin:0}.scheme-intro p{margin:0;color:#9499a5;font-size:12px}.scheme-intro .tag{font:10px ui-monospace,monospace;color:#b5a2d6;letter-spacing:.6px;border:1px solid #3b3348;padding:3px 6px;border-radius:3px}.terminal{--bg:#151419;--surface:#1d1b23;--text:#d9d8df;--strong:#f2f0f7;--muted:#9894a1;--faint:#6e6979;--accent:#b29acc;--line:#302b39;--green:#8db59a;--red:#d28686;--yellow:#c5ab74;background:var(--bg);color:var(--text);border:1px solid #2e2b34;border-radius:10px;overflow:hidden;box-shadow:0 18px 65px #0004;min-height:600px;display:flex;flex-direction:column;font:12px/1.7 "SFMono-Regular",Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace}.topbar{height:42px;display:flex;align-items:center;gap:13px;padding:0 20px;border-bottom:1px solid var(--line);font-size:11px}.logo{color:var(--accent);font-weight:700;letter-spacing:1px;font-size:12px}.top-title{color:var(--text);font-size:11px}.top-project{color:var(--faint);margin-left:2px}.top-meta{margin-left:auto;display:flex;gap:14px;color:var(--muted);font-size:10px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:460px;flex:1}.chat{padding:25px 28px 12px;display:flex;flex-direction:column;gap:15px;overflow:hidden}.sidebar{padding:23px 19px;border-left:1px solid var(--line);font-size:11px}.user{align-self:flex-end;max-width:90%;padding:8px 13px;background:var(--surface);border-radius:5px;color:var(--strong);font-size:12px}.assistant{color:var(--text);max-width:700px;font-size:12px}.assistant p{margin:0 0 9px}.assistant strong{font-weight:500;color:var(--strong)}.assistant h3{font-size:12px;color:var(--strong);font-weight:600;margin:0 0 8px}.muted{color:var(--muted)}.tool{border-left:1px solid var(--line);padding:2px 0 2px 13px;font-size:11px;line-height:1.85}.tool-line{display:flex;gap:8px;white-space:nowrap}.tool-name{color:var(--strong);font-weight:600}.tool-path{color:var(--accent)}.tool-detail{color:var(--muted)}.tool .check{color:var(--green)}.tool .expand{color:var(--faint);margin-top:2px}.code{font-size:10px;padding:7px 10px;background:#00000012;margin:4px 0;color:var(--muted);border-radius:3px}.code .add{color:var(--green)}.code .del{color:var(--red)}.running{display:flex;gap:9px;color:var(--muted);font-size:11px;align-items:center}.pulse{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}.side-section{margin-bottom:22px}.side-label{font-size:10px;color:var(--faint);display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;letter-spacing:.7px}.side-label button{font:inherit;color:var(--faint);border:0;background:none;padding:0;cursor:pointer}.goal{font-family:Inter,"PingFang SC",sans-serif;font-size:11px;line-height:1.65;color:var(--text)}.task{display:flex;gap:8px;font-size:10px;line-height:1.85;color:var(--muted)}.task.current{color:var(--text)}.done{color:var(--green)}.current .dot{color:var(--accent)}.usage-number{display:flex;align-items:baseline;gap:5px;color:var(--strong);font-size:22px;font-weight:400;letter-spacing:-1px}.usage-number small{font-size:10px;color:var(--muted);letter-spacing:0}.bar{height:3px;background:var(--line);margin:9px 0 6px;border-radius:2px;overflow:hidden}.bar i{height:100%;display:block;width:38%;background:var(--accent)}.cost{font-size:18px;color:var(--strong);letter-spacing:-.5px}.cost-detail{font-size:10px;color:var(--muted);margin-top:4px}.composer-wrap{padding:0 20px 13px 26px}.composer{border:1px solid var(--line);background:var(--surface);padding:11px 13px 9px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.prompt{color:var(--accent);margin-right:9px}.send{color:var(--faint);font-size:10px}.status{display:flex;align-items:center;gap:15px;padding:0 20px 0 26px;height:31px;font-size:10px;color:var(--faint)}.status .permission{color:var(--accent)}.status .right{margin-left:auto;display:flex;gap:14px}.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:20px 0 0}.principle{border-top:1px solid #2b2d33;padding-top:12px}.principle b{font-size:12px;font-weight:500}.principle p{font-size:11px;color:#9196a1;line-height:1.7;margin:5px 0 0}.palette{display:flex;gap:4px;margin-top:9px}.palette i{width:23px;height:5px;border-radius:1px}.comparison{display:grid;gap:48px}.comparison .terminal{box-shadow:none}.comparison .scheme-intro{margin-top:4px}.footer{margin-top:32px;color:#818692;font-size:11px;line-height:1.8}.light .terminal{--bg:#f5f3ee;--surface:#ebe6dc;--text:#45433e;--strong:#252522;--muted:#716c62;--faint:#8c867a;--accent:#697750;--line:#dbd5ca;--green:#537a58;--red:#a55f55;--yellow:#977a40;border-color:#d4cfc5;box-shadow:0 18px 65px #0002}.light .topbar{border-bottom:0}.light .workspace{grid-template-columns:minmax(0,1fr) 240px}.light .chat{padding-top:30px;gap:20px}.light .sidebar{border-left:0;background:#efede6;margin:12px 0;border-radius:5px;padding:20px 18px}.light .user{border:1px solid var(--line);background:transparent;padding:9px 14px;align-self:flex-start;border-radius:3px;max-width:100%}.light .assistant{font-size:12px;line-height:1.8}.light .assistant p{margin-bottom:14px}.light .assistant h3{font-family:Inter,"PingFang SC",sans-serif;font-size:13px}.light .tool{border:0;border-top:1px solid var(--line);padding:10px 0 0}.light .code{background:#e9e7df}.light .composer{background:var(--bg);border-color:#c5bdac;border-radius:3px;padding:13px}.light .side-label{letter-spacing:1.5px}.light .side-section{margin-bottom:27px}.light .bar{height:4px}.light .palette-note{color:var(--accent)}.signal .terminal{--bg:#111313;--surface:#191c1b;--text:#c3c8c2;--strong:#e5e9e1;--muted:#909b90;--faint:#677267;--accent:#c2ab74;--line:#333a32;--green:#86ab8b;--red:#ce8176;border-color:#353c34;border-radius:3px}.signal .topbar{height:38px;padding:0 14px;font-size:10px}.signal .workspace{grid-template-columns:minmax(0,1fr) 285px;min-height:460px}.signal .chat{padding:17px 19px 10px;gap:10px}.signal .sidebar{padding:17px 15px}.signal .user{border-radius:0;align-self:stretch;padding:7px 10px}.signal .tool{border-left:2px solid var(--line);padding-left:10px}.signal .tool-line{line-height:1.65}.signal .side-section{margin-bottom:16px}.signal .side-label{border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:7px}.signal .usage-number{font-size:20px}.signal .bar{border-radius:0;height:4px}.signal .composer-wrap{padding:0 12px 10px 17px}.signal .composer{border-radius:0;background:transparent;padding:9px 11px}.signal .status{padding:0 14px 0 18px;height:28px;border-top:1px solid var(--line)}.signal .code{border-radius:0}.compact .workspace{grid-template-columns:minmax(0,1fr) 215px}.compact .chat{padding-left:20px;padding-right:20px}.compact .sidebar{padding-left:13px;padding-right:13px}.compact .tool-detail{overflow:hidden;text-overflow:ellipsis}.compact .top-project{display:none}.no-sidebar .workspace{grid-template-columns:1fr}.no-sidebar .sidebar{display:none}.no-sidebar .chat{max-width:850px}.light.compact .workspace{grid-template-columns:minmax(0,1fr) 205px}.light.no-sidebar .workspace{grid-template-columns:1fr}.terminal.narrow{max-width:830px}.narrow .workspace{grid-template-columns:1fr}.narrow .sidebar{display:none}.narrow .top-meta span:first-child{display:none}.narrow .status{gap:9px}.narrow .status .right span:first-child{display:none}.scheme-block{scroll-margin-top:20px}@media(max-width:850px){.gallery{padding:24px 15px}.intro{align-items:start;flex-direction:column}.principles{gap:12px}.workspace{grid-template-columns:1fr}.sidebar{display:none}.top-project{display:none}.chat{padding:18px}.topbar{padding:0 15px}.composer-wrap{padding-left:16px}.status{padding-left:16px}}
</style>
</head>
<body>
<main class="gallery">
<div class="eyebrow">HAJI / TERMINAL INTERFACE EXPLORATION · 01</div>
<header class="intro"><div><h1>让终端安静下来，让状态一眼可读。</h1><p>同一工作内容，三种视觉性格。对话仍是主角，状态保持克制。</p></div><nav class="controls" aria-label="原型控制"><button data-scheme="editor" class="active">01 静墨</button><button data-scheme="paper">02 纸间</button><button data-scheme="signal">03 信号</button><span class="divider"></span><button id="width">窄屏</button><button id="sidebar">侧栏</button></nav></header>
<div id="prototype"></div>
<footer class="footer">交互预览：点击上方切换方案，按 1 / 2 / 3 快速切换；N 切换窄屏，S 隐藏侧栏。<br>这是视觉与布局原型，不改变现有功能、快捷键、侧栏优先级或工具折叠逻辑。颜色可按终端能力降级。</footer>
</main>
<script>
const schemes={
editor:{key:'',number:'01',name:'静墨',en:'QUIET EDITOR',desc:'低干扰深色 · 紫色只用于焦点 · 适合长时间编程',items:[['降噪','去掉对话内的多余容器；靠留白而非粗边框分区。'],['聚焦','正文接近白色，辅助信息中性灰，紫色只标记路径与当前状态。'],['平衡','圆环换成细进度条，保留用量与费用主指标，降低侧栏存在感。']],colors:['#151419','#d9d8df','#b29acc','#8db59a']},
paper:{key:'light',number:'02',name:'纸间',en:'WARM PAPER',desc:'暖灰浅色 · 文档式阅读 · 适合写作、审阅与日间使用',items:[['呼吸','增加段落间距；用户消息不再是一块深色“气泡”。'],['纸感','暖白背景、鼠尾草绿强调；浅底不用低对比中灰字。'],['层次','侧栏融入一块浅灰纸面，输入框以轮廓形成明确落点。']],colors:['#f5f3ee','#45433e','#697750','#ebe6dc']},
signal:{key:'signal',number:'03',name:'信号',en:'DENSE SIGNAL',desc:'深色工具感 · 紧凑行距 · 适合多任务与高频监控',items:[['密度','更紧凑的行距与分区线，一屏容纳更多任务及工具记录。'],['扫描','细分隔线与指标对齐，让运行状态和异常更快被扫到。'],['收敛','琥珀色仅用于当前焦点；成功、错误仍保留独立语义色。']],colors:['#111313','#c3c8c2','#c2ab74','#86ab8b']}
};
let current='editor',narrow=false,sidebar=true;
function terminal(){return `<section class="terminal" aria-label="haji TUI ${schemes[current].name}原型">
<header class="topbar"><span class="logo">haji</span><span class="top-title">重构终端视觉层级</span><span class="top-project">~/hajicli</span><div class="top-meta"><span>master*</span><span>deepseek · medium</span></div></header>
<div class="workspace"><div class="chat">
<div class="user">现在侧栏的信息有点满，能帮我把层级梳理得更清楚吗？</div>
<div class="assistant"><p>可以。我会保留所有关键状态，但让视线先落在<strong>当前工作</strong>，再看资源用量。</p><h3>调整这三个层级</h3><p class="muted">目标与进行中任务优先 · 上下文与费用退后 · 工具结果按需展开</p></div>
<div class="tool"><div class="tool-line"><span class="check">✓</span><span class="tool-name">read</span><span class="tool-path">packages/cli/src/tui-sidebar.ts</span><span class="tool-detail">852 lines</span></div><div class="tool-line"><span class="check">✓</span><span class="tool-name">edit</span><span class="tool-path">packages/cli/src/theme.ts</span><span class="tool-detail">+12 −8</span></div><div class="code"><span class="del">− muted: "#77717f"</span><br><span class="add">+ muted: "#9894a1"</span></div><div class="expand">⌄ 还有 6 行 · 点击展开</div></div>
<div class="running"><i class="pulse"></i><span>检查窄屏下的信息密度</span><span class="muted">· 8s</span></div>
</div><aside class="sidebar">
<section class="side-section"><div class="side-label"><span>当前目标</span><span>01</span></div><div class="goal">让对话保持专注，<br>让关键状态始终可见。</div></section>
<section class="side-section"><div class="side-label"><span>任务</span><span>2 / 4</span></div><div class="task done"><span>✓</span><span>梳理信息优先级</span></div><div class="task done"><span>✓</span><span>收拢工具输出</span></div><div class="task current"><span class="dot">●</span><span>调整视觉层级</span></div><div class="task"><span>○</span><span>窄屏回归验证</span></div></section>
<section class="side-section"><div class="side-label"><span>上下文</span><span>38%</span></div><div class="usage-number">380k <small>/ 1M</small></div><div class="bar"><i></i></div><div class="cost-detail">剩余 620k · 已压缩 1 次</div></section>
<section class="side-section"><div class="side-label"><span>本次花费</span><button>明细 ↗</button></div><div class="cost">¥0.4231</div><div class="cost-detail">18 次请求 · 12.4s</div></section>
</aside></div>
<div class="composer-wrap"><div class="composer"><span><span class="prompt">›</span>继续输入，或用 / 查看指令…</span><span class="send">⏎ 发送</span></div></div>
<footer class="status"><span class="permission">默认权限</span><span>deepseek-chat</span><span>medium</span><div class="right"><span>Ctrl+O 展开</span><span>? 帮助</span></div></footer></section>`}
function block(name){const s=schemes[name];return `<article class="scheme-block ${s.key}"><div class="scheme-intro"><span class="tag">${s.number} / ${s.en}</span><h2>${s.name}</h2><p>${s.desc}</p></div>${terminal()}<div class="principles">${s.items.map(x=>`<div class="principle"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div><div class="palette">${s.colors.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('')}</div></article>`}
function render(){document.getElementById('prototype').innerHTML=`<div class="${narrow?'narrow-wrap':''} ${sidebar?'':'no-sidebar'}">${block(current)}</div>`;document.querySelectorAll('[data-scheme]').forEach(b=>b.classList.toggle('active',b.dataset.scheme===current));document.getElementById('width').classList.toggle('active',narrow);document.getElementById('sidebar').classList.toggle('active',!sidebar);document.getElementById('sidebar').textContent=sidebar?'侧栏':'无侧栏';const t=document.querySelector('.terminal');if(narrow)t.classList.add('narrow');if(!sidebar)document.querySelector('.scheme-block').classList.add('no-sidebar');document.querySelector('.gallery').classList.toggle('compact',narrow);history.replaceState(null,'',`?scheme=${current}${narrow?'&narrow=1':''}`)}
document.querySelectorAll('[data-scheme]').forEach(b=>b.onclick=()=>{current=b.dataset.scheme;render()});document.getElementById('width').onclick=()=>{narrow=!narrow;render()};document.getElementById('sidebar').onclick=()=>{sidebar=!sidebar;render()};document.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)){current=['editor','paper','signal'][+e.key-1];render()}if(e.key.toLowerCase()==='n'){narrow=!narrow;render()}if(e.key.toLowerCase()==='s'){sidebar=!sidebar;render()}});const p=new URLSearchParams(location.search);if(schemes[p.get('scheme')])current=p.get('scheme');narrow=p.get('narrow')==='1';render();
</script>
</body></html>
