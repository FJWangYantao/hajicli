[package]
name = "haji_terminal_engine"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
unicode-segmentation = "1.12"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
