name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20.18.1, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # 打包自检含 Rust 原生编译，与 Node 版本无关，只在基准版本上跑，节省矩阵时长
      - name: Pack check (base node only)
        if: matrix.node == '20.18.1'
        run: pnpm pack:check
